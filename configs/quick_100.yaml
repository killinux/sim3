simulation:
  num_agents: 100
  num_simulated_days: 1
  random_seed: 42

agent:
  max_sessions_per_day: 1
  max_videos_per_session: 10
  memory_window: 30

llm:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.7
  max_tokens: 300
  max_concurrent: 50
  timeout_seconds: 60

recommendation:
  top_k: 10
  epsilon: 0.1
  diversity_weight: 0.2

ab_test:
  enabled: true
  treatment_ratio: 0.5
  treatment_config:
    diversity_weight: 0.5
    epsilon: 0.2

content_pool:
  num_videos: 5000
  num_categories: 20
